name: Build ERPNext16 AIO image (single container)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/erpnext16-single-container-aio.yml'
      - 'erpnext16/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag like v16.32.0 (optional; empty = latest official ERPNext v16.x.y)"
        required: false
      apps_json_path:
        description: "Path to apps.json used as AIO build input"
        required: false
        default: "erpnext16/image/apps.json"
      force_rebuild:
        description: "Disable Docker build cache for this run (true/false)"
        required: false
        default: "false"
      upload_image_artifact:
        description: "Also export a compressed image artifact for manual docker load (true/false)"
        required: false
        default: "false"
  schedule:
    # GitHub Actions cron uses UTC. Rebuild monthly so the image also picks up
    # the current Ashan custom app even when ERPNext itself has not changed.
    - cron: "41 2 1 * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: erpnext16-aio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The version-sync commit made by this workflow would otherwise trigger a
    # second identical push build.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout docker repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve official ERPNext v16.x.y
        id: official
        shell: bash
        run: |
          set -euo pipefail

          INPUT_VER="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT_VER" ]]; then
            VER_V="$INPUT_VER"
          else
            MAJOR=16
            PATTERN="^v?${MAJOR}\.[0-9]+\.[0-9]+$"
            url='https://hub.docker.com/v2/repositories/frappe/erpnext/tags?page_size=100'
            tmp="$(mktemp)"
            : > "$tmp"

            for _ in $(seq 1 20); do
              json="$(curl -fsSL "$url")"
              echo "$json" | jq -r '.results[].name' | grep -E "$PATTERN" >> "$tmp" || true
              url="$(echo "$json" | jq -r '.next // empty')"
              [[ -z "$url" || "$url" == "null" ]] && break
            done

            VER_V="$(sort -V "$tmp" | tail -n1 || true)"
            rm -f "$tmp"
            [[ -n "$VER_V" ]] || {
              echo "::error::Could not discover the latest official ERPNext v16 tag."
              exit 1
            }
          fi

          [[ "$VER_V" == v* ]] || VER_V="v$VER_V"
          echo "version=$VER_V" >> "$GITHUB_OUTPUT"
          echo "ERPNext version: $VER_V" >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize ERPNEXT_VERSION
        id: syncver
        shell: bash
        run: |
          set -euo pipefail

          TARGET="erpnext16/ERPNEXT_VERSION"
          OFFICIAL="${{ steps.official.outputs.version }}"
          CURRENT=""

          if [[ -f "$TARGET" ]]; then
            CURRENT="$(tr -d '\r\n' < "$TARGET")"
          fi

          if [[ "$CURRENT" != "$OFFICIAL" ]]; then
            printf '%s\n' "$OFFICIAL" > "$TARGET"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$OFFICIAL" >> "$GITHUB_OUTPUT"

      - name: Commit tracked ERPNext version bump
        if: ${{ steps.syncver.outputs.version_changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add erpnext16/ERPNEXT_VERSION

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(erpnext16): bump tracked version to ${{ steps.syncver.outputs.version }}"
          git push

      - name: Fetch Ashan ERPNext custom app
        shell: bash
        env:
          ASHAN_REPO_TOKEN: ${{ secrets.ASHAN_REPO_TOKEN }}
          ASHAN_REPO_REF: main
        run: |
          set -euo pipefail
          chmod +x erpnext16/scripts/fetch-ashan-custom-app.sh
          bash erpnext16/scripts/fetch-ashan-custom-app.sh

      - name: Verify Ashan build context and capture revision
        id: ashan
        shell: bash
        run: |
          set -euo pipefail

          APP="erpnext16/custom-apps/ashan_cn_procurement"
          test -f "$APP/pyproject.toml"
          test -d "$APP/ashan_cn_procurement"
          test -f "$APP/ashan_cn_procurement/hooks.py"
          test -f "$APP/.ashan-source-commit"

          ASHAN_SHA="$(tr -d '\r\n' < "$APP/.ashan-source-commit")"
          [[ "$ASHAN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid Ashan source commit marker: $ASHAN_SHA"
            exit 1
          }

          echo "sha=$ASHAN_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${ASHAN_SHA:0:12}" >> "$GITHUB_OUTPUT"

          echo "Ashan app commit: $ASHAN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Ashan app branch: main" >> "$GITHUB_STEP_SUMMARY"

      - name: Build APPS_JSON_BASE64
        id: apps
        shell: bash
        run: |
          set -euo pipefail

          VER_V="${{ steps.syncver.outputs.version }}"
          APPS_JSON_PATH="${{ github.event.inputs.apps_json_path }}"

          if [[ -z "$APPS_JSON_PATH" ]]; then
            APPS_JSON_PATH="erpnext16/image/apps.json"
          fi

          if [[ ! -f "$APPS_JSON_PATH" ]]; then
            echo "::error::apps.json not found: $APPS_JSON_PATH"
            exit 2
          fi

          APPS_JSON_BASE64="$(
            jq --arg ver "$VER_V" \
              'map(if (.url|endswith("/erpnext")) then .branch=$ver else . end)' \
              "$APPS_JSON_PATH" \
            | (base64 -w 0 2>/dev/null || base64 | tr -d '\n')
          )"

          echo "apps_json_base64=$APPS_JSON_BASE64" >> "$GITHUB_OUTPUT"

      - name: Resolve Frappe ref for AIO build
        id: frappe_ref
        shell: bash
        run: |
          set -euo pipefail

          ERPNEXT_REF="${{ steps.syncver.outputs.version }}"
          FRAPPE_REF="$ERPNEXT_REF"

          if git ls-remote --exit-code --tags https://github.com/frappe/frappe \
              "refs/tags/${FRAPPE_REF}" >/dev/null 2>&1; then
            echo "frappe_ref=$FRAPPE_REF" >> "$GITHUB_OUTPUT"
            echo "frappe_ref_mode=exact_tag" >> "$GITHUB_OUTPUT"
            echo "Using exact Frappe tag: $FRAPPE_REF" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git ls-remote --exit-code --heads https://github.com/frappe/frappe \
              "refs/heads/version-16" >/dev/null 2>&1; then
            echo "frappe_ref=version-16" >> "$GITHUB_OUTPUT"
            echo "frappe_ref_mode=version_branch" >> "$GITHUB_OUTPUT"
            echo "::warning::Exact Frappe tag $FRAPPE_REF not found; using version-16."
            echo "Frappe fallback: version-16" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Neither Frappe tag $FRAPPE_REF nor version-16 is available."
          exit 1

      - name: Resolve image trace tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ERPNext16 AIO image
        uses: docker/build-push-action@v6
        with:
          context: ./erpnext16
          file: ./erpnext16/single-aio/Containerfile
          push: true
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' }}
          build-args: |
            FRAPPE_IMAGE_TAG=version-16
            FRAPPE_BRANCH=${{ steps.frappe_ref.outputs.frappe_ref }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            APPS_JSON_BASE64=${{ steps.apps.outputs.apps_json_base64 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.syncver.outputs.version }}-aio
            com.ashan.erpnext.custom-app.revision=${{ steps.ashan.outputs.sha }}
            com.ashan.erpnext.custom-app.ref=main
          tags: |
            ghcr.io/${{ github.repository_owner }}/erpnext16:aio
            ghcr.io/${{ github.repository_owner }}/erpnext16:latest
            ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.syncver.outputs.version }}-aio
            ghcr.io/${{ github.repository_owner }}/erpnext16:sha-${{ steps.meta.outputs.short_sha }}-aio

      - name: Smoke-check image metadata
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.syncver.outputs.version }}-aio"
          docker buildx imagetools inspect "$IMAGE"

      - name: Export docker image artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_image_artifact == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/erpnext16:${{ steps.syncver.outputs.version }}-aio"
          OUT="/tmp/erpnext16-${{ steps.syncver.outputs.version }}-aio.docker.tar.gz"

          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > "$OUT"
          ls -lh "$OUT"

      - name: Upload docker image artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_image_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: erpnext16-${{ steps.syncver.outputs.version }}-aio-docker-image
          path: /tmp/erpnext16-${{ steps.syncver.outputs.version }}-aio.docker.tar.gz
          if-no-files-found: error
          compression-level: 0
